services:
  configserver:
    image: "artwh0/configserver:v1"
    container_name: "configserver-ms"
    ports:
      - "8071:8071"
    healthcheck:
      test: "curl --fail --silent localhost:8071/actuator/health | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - bank

  accounts:
    image: "artwh0/accounts:v1"
    container_name: "accounts-ms"
    ports:
      - "8080:8080"
    environment:
      SPRING_CONFIG_IMPORT: "configserver:http://configserver:8071/"
      SPRING_PROFILES_ACTIVE: "prod"
    depends_on:
      configserver:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - bank

  cards:
    image: "artwh0/cards:v1"
    container_name: "cards-ms"
    ports:
      - "8090:8090"
    environment:
      SPRING_CONFIG_IMPORT: "configserver:http://configserver:8071/"
      SPRING_PROFILES_ACTIVE: "prod"
    depends_on:
      configserver:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - bank

  loans:
    image: "artwh0/loans:v1"
    container_name: "loans-ms"
    ports:
      - "9000:9000"
    environment:
      SPRING_CONFIG_IMPORT: "configserver:http://configserver:8071/"
      SPRING_PROFILES_ACTIVE: "prod"
    depends_on:
      configserver:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - bank

networks:
  bank:
    driver: "bridge"